<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tag Selector</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">



<!-- 左侧 -->

<div class="sidebar">


<h2>搜索</h2>


<input 
id="search-input"
placeholder="输入中文搜索..."
>



<div id="search-results"></div>



<hr>



<h2>分类</h2>


<div id="categories"></div>



<hr>



<h2>随机设置</h2>


<div id="random-categories"></div>



<button id="random-btn">
每类随机一个
</button>



</div>






<!-- 中间 -->


<div class="tags-panel">


<h2 id="category-title">
请选择分类
</h2>


<div id="tags"></div>


</div>







<!-- 右侧 -->


<div class="selected-panel">


<h2>
已选择 Tags
<span id="count">
0
</span>
</h2>


<div id="selected-tags"></div>



<div class="buttons">


<button id="copy-btn">
复制 Prompt
</button>


<button id="clear-btn">
清空
</button>


</div>


</div>




</div>


<script src="app.js"></script>


</body>

</html>
