<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>Tag Selector</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<!-- 左侧大类 -->

<div class="left panel">

<h2>分类</h2>

<div id="categories"></div>


<hr>


<h2>随机</h2>

<div id="random-box"></div>


<button id="random-btn">
随机生成
</button>


</div>





<!-- 中间内容 -->

<div class="middle panel">


<div class="top-search">

<input
id="search"
placeholder="搜索中文tag..."
>


<div id="search-result"></div>

</div>



<h2 id="title">
请选择分类
</h2>


<div id="content"></div>


</div>






<!-- 右侧 -->

<div class="right panel">


<h2>
已选择
<span id="count">
0
</span>
</h2>


<div id="selected"></div>


<button id="copy">
复制
</button>


<button id="clear">
清空
</button>


</div>


</div>



<script src="app.js"></script>

</body>

</html>
