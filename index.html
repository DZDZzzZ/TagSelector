<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>Tag Selector</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<!-- 一级分类 -->

<div class="panel">

<h2>分类</h2>

<div id="categories"></div>


<hr>


<h2>随机</h2>

<div id="random-categories"></div>

<button id="random-btn">
每类随机一个
</button>


</div>





<!-- 子分类 -->

<div class="panel">

<h2>子分类</h2>

<div id="subcategories"></div>


</div>






<!-- Tags -->

<div class="panel">


<h2>Tags</h2>


<input 
id="search-input"
placeholder="中文搜索..."
>


<div id="search-results"></div>



<div id="tags"></div>



</div>







<!-- 已选择 -->

<div class="panel selected">


<h2>
已选择
<span id="count">0</span>
</h2>


<div id="selected-tags"></div>



<button id="copy-btn">
复制 Prompt
</button>


<button id="clear-btn">
清空
</button>



</div>



</div>


<script src="app.js"></script>


</body>

</html>
